<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    --bg:#F6F2EC; --surface:#FFFFFF; --surface-alt:#EFE8DC; --ink:#2B2420; --ink-muted:#83725F;
    --accent:#8B5E34; --accent-dark:#6B4423; --sage:#4C6B58; --sage-dark:#374F3E; --rust:#B3492D; --border:#E2D9C9;
    font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg);
  }
  #root{ min-height:100vh; display:flex; flex-direction:column; max-width:1080px; margin:0 auto; }
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .strong{ font-weight:600; }

  .loading-screen{ display:flex; align-items:center; gap:10px; justify-content:center; height:60vh; color:var(--ink-muted); font-size:14px; }
  .spinner{ width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 28px; width:100%; max-width:360px; text-align:center; }
  .login-emoji{ font-size:32px; margin-bottom:6px; }
  .login-card h1{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px; }
  .login-form{ display:flex; flex-direction:column; gap:12px; margin-top:18px; text-align:left; }
  .btn.full{ width:100%; justify-content:center; }

  .app-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:32px; height:32px; border-radius:8px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .brand h1{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin:0; cursor:pointer; letter-spacing:-0.01em; }
  .brand-input{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; border:none; border-bottom:1px dashed var(--accent); background:transparent; outline:none; color:var(--ink); }
  .header-right{ display:flex; align-items:center; gap:14px; }
  .header-date{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted); }
  .logout-btn{ font-size:12px; color:var(--ink-muted); background:none; border:none; cursor:pointer; text-decoration:underline; }
  .logout-btn:hover{ color:var(--ink); }

  .app-nav{ display:flex; gap:4px; padding:6px; margin:0 20px 8px; background:var(--surface-alt); border-radius:12px; overflow-x:auto; }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px; border:none; background:transparent; border-radius:9px; color:var(--ink-muted); font-size:11px; font-family:'Inter',sans-serif; cursor:pointer; transition:background .15s,color .15s; white-space:nowrap; }
  .nav-btn.active{ background:var(--surface); color:var(--accent-dark); box-shadow:0 1px 2px rgba(43,36,32,0.08); font-weight:600; }
  .nav-btn:hover:not(.active){ color:var(--ink); }
  .nav-emoji{ font-size:16px; }

  .app-main{ flex:1; padding:4px 20px 100px; }
  .view-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .view-head h2{ font-family:'Fraunces',serif; font-size:24px; margin:0; font-weight:600; }
  .view{ animation:fadein .2s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }

  .btn{ display:inline-flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid transparent; cursor:pointer; transition:opacity .15s, background .15s; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-accent:hover:not(:disabled){ background:var(--accent-dark); }
  .btn-ghost{ background:transparent; border-color:var(--border); color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-alt); }

  .icon-btn{ border:none; background:transparent; color:var(--ink-muted); cursor:pointer; padding:6px; border-radius:6px; display:inline-flex; font-size:14px; }
  .icon-btn:hover{ background:var(--surface-alt); color:var(--ink); }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; position:relative; }
  .stat-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .stat-label{ font-size:12px; color:var(--ink-muted); }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .stat-sub{ font-size:11px; color:var(--ink-muted); margin-top:4px; }
  .tone-accent{ color:var(--accent-dark); }
  .tone-sage{ color:var(--sage-dark); }
  .tone-rust{ color:var(--rust); }
  .tone-ink{ color:var(--ink); }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .two-col{ grid-template-columns:1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h3{ font-family:'Fraunces',serif; font-size:15px; margin:0 0 10px; font-weight:600; }
  .muted-note{ font-size:13px; color:var(--ink-muted); }

  .list{ list-style:none; margin:0; padding:0; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--border); }
  .list-row:last-child{ border-bottom:none; }
  .row-title{ font-size:13px; font-weight:600; }
  .row-sub{ font-size:11px; color:var(--ink-muted); margin-top:2px; }
  .row-amount{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; }

  .tag{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap; }
  .tag-rust{ background:#F5E3DC; color:var(--rust); }
  .tag-sage{ background:#E2E9E4; color:var(--sage-dark); }

  .empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:48px 20px; color:var(--ink-muted); border:1px dashed var(--border); border-radius:14px; background:var(--surface); }
  .empty-state h3{ font-family:'Fraunces',serif; color:var(--ink); font-size:17px; margin:4px 0 0; }
  .empty-state p{ font-size:13px; max-width:320px; margin:0 0 6px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; flex:1; min-width:180px; color:var(--ink-muted); }
  .search-box input{ border:none; outline:none; background:transparent; font-size:13px; width:100%; color:var(--ink); }
  .select{ border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:8px 10px; font-size:13px; color:var(--ink); }
  .select.full{ width:100%; }

  .stock-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .stock-tag{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:10px 10px 10px 2px; padding:14px 14px 14px 22px; }
  .stock-tag.low{ border-color:#E3B7A6; }
  .stock-tag-hole{ position:absolute; top:14px; left:-1px; width:10px; height:10px; border-radius:50%; background:var(--bg); border:1px solid var(--border); }
  .stock-tag::before{ content:""; position:absolute; inset:6px; border:1px dashed var(--border); border-radius:7px 7px 7px 2px; pointer-events:none; }
  .stock-tag-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .stock-name{ font-weight:600; font-size:14px; }
  .stock-cat{ font-size:11px; color:var(--ink-muted); margin-top:1px; }
  .stock-actions{ display:flex; gap:2px; }
  .stock-details{ display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--ink-muted); margin:8px 0; }
  .stock-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }

  .supplier-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .supplier-actions{ display:flex; align-items:center; gap:4px; }
  .supplier-btns{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .supplier-list{ display:flex; flex-direction:column; }

  .ledger-card{ position:relative; }
  .ledger-card::before{ content:""; position:absolute; inset:5px; border:1px dashed var(--border); border-radius:9px; pointer-events:none; }
  .table-wrap{ overflow-x:auto; }
  .ledger-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .ledger-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted); padding:8px 10px; border-bottom:1px solid var(--border); }
  .ledger-table td{ padding:9px 10px; border-bottom:1px dashed var(--border); }
  .ledger-table tr:last-child td{ border-bottom:none; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(43,36,32,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-panel{ background:var(--surface); width:100%; max-width:480px; border-radius:16px 16px 0 0; max-height:88vh; overflow-y:auto; padding-bottom:8px; }
  @media (min-width:640px){ .modal-backdrop{ align-items:center; } .modal-panel{ border-radius:16px; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); border-radius:16px 16px 0 0; }
  .modal-head h3{ font-family:'Fraunces',serif; font-size:17px; margin:0; }
  .modal-body{ padding:16px 18px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .form-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.full-width{ grid-column:1 / -1; }
  .field-label{ font-size:11px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.02em; }
  .input{ border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13px; font-family:'Inter',sans-serif; color:var(--ink); outline:none; width:100%; }
  .input:focus{ border-color:var(--accent); }
  .total-preview{ margin-top:12px; font-size:13px; padding:10px 12px; background:var(--surface-alt); border-radius:8px; }
  .form-error{ margin-top:4px; font-size:12px; color:var(--rust); background:#F5E3DC; padding:8px 10px; border-radius:8px; }

  .bar-chart{ display:flex; align-items:flex-end; gap:16px; height:220px; padding:10px 4px 0; overflow-x:auto; }
  .bar-group{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:44px; height:100%; justify-content:flex-end; }
  .bars{ display:flex; align-items:flex-end; gap:4px; height:180px; }
  .bar{ width:14px; border-radius:3px 3px 0 0; min-height:2px; }
  .bar-accent{ background:var(--accent); }
  .bar-sage{ background:var(--sage); }
  .bar-label{ font-size:10px; color:var(--ink-muted); white-space:nowrap; }
  .bar-legend{ display:flex; gap:16px; font-size:11px; color:var(--ink-muted); margin-top:8px; align-items:center; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .dot-accent{ background:var(--accent); }
  .dot-sage{ background:var(--sage); }

  .supplier-summary{ display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .summary-chip{ flex:1; min-width:130px; background:var(--surface-alt); border-radius:9px; padding:9px 12px; }
  .summary-chip .summary-label{ font-size:10px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; }
  .summary-chip .summary-value{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; margin-top:2px; }
  .section-subhead{ display:flex; align-items:center; justify-content:space-between; margin:16px 0 8px; }
  .section-subhead h4{ font-family:'Fraunces',serif; font-size:13px; font-weight:600; margin:0; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; }
  .file-drop{ border:1px dashed var(--border); border-radius:8px; padding:14px; font-size:12px; color:var(--ink-muted); text-align:center; cursor:pointer; transition:background .15s,border-color .15s; }
  .file-drop:hover{ background:var(--surface-alt); border-color:var(--accent); }
  .file-drop input{ display:none; }
  .attachment-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .attachment-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-alt); border:1px solid var(--border); border-radius:100px; padding:4px 6px 4px 10px; font-size:11px; max-width:220px; }
  .attachment-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; text-decoration:underline; }
  .attachment-chip button{ border:none; background:none; cursor:pointer; color:var(--ink-muted); font-size:13px; line-height:1; padding:2px 4px; }
  .attachment-chip button:hover{ color:var(--rust); }
  .attachment-badge{ font-size:10px; color:var(--ink-muted); display:inline-flex; align-items:center; gap:3px; }
  .empty-row{ font-size:12px; color:var(--ink-muted); padding:10px 0; text-align:center; }

  /* ---- Ledger report ---- */
  .ledger-toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:flex-end; }
  .ledger-toolbar .field{ min-width:150px; }
  .ledger-toolbar .field-label{ margin-bottom:1px; }
  .ledger-export-btn{ margin-left:auto; }
  .type-pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap; }
  .type-pill.purchase{ background:#F5E3DC; color:var(--rust); }
  .type-pill.payment{ background:#E2E9E4; color:var(--sage-dark); }
  .balance-due{ color:var(--rust); }
  .balance-clear{ color:var(--sage-dark); }

  /* ---- Notify modal / challan ---- */
  .textarea{ min-height:150px; resize:vertical; line-height:1.5; }
  .challan-actions{ display:flex; gap:10px; margin:12px 0 4px; flex-wrap:wrap; }
  .notify-hint{ font-size:12px; color:var(--ink-muted); margin-top:8px; background:var(--surface-alt); padding:9px 11px; border-radius:8px; }
  .notif-status{ display:inline-flex; align-items:center; gap:4px; font-size:11px; }
  .bell-btn{ font-size:13px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const {
  useState,
  useEffect,
  useMemo
} = React;
const {
  createClient
} = supabase;

// =====================================================================
// PASTE YOUR SUPABASE PROJECT DETAILS HERE (Settings -> API in Supabase)
// =====================================================================
const SUPABASE_URL = "https://zkdfiilwqckfcgpyzlki.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprZGZpaWx3cWNrZmNncHl6bGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODgyMTEsImV4cCI6MjEwMzU2NDIxMX0.E8Wuah37DdD8H5CxMsn_JF4OjGsQy8Tlx3snk5vu6rA";
// =====================================================================

const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOW_STOCK_THRESHOLD = 3;

// ---------- helpers ----------
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtMoney = n => "\u20B9" + Math.round(Number(n) || 0).toLocaleString("en-IN");
const todayStr = () => new Date().toISOString().slice(0, 10);
const monthKey = dateStr => (dateStr || todayStr()).slice(0, 7);
const monthLabel = key => {
  const [y, m] = key.split("-");
  return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString("en-IN", {
    month: "short",
    year: "numeric"
  });
};
const dateLabel = dateStr => new Date(dateStr).toLocaleDateString("en-IN", {
  day: "numeric",
  month: "short",
  year: "numeric"
});
const h = React.createElement; // shorthand used by the newer components below

// ---------- phone / messaging helpers ----------
const digitsOnly = str => (str || "").replace(/\D/g, "");
function toWhatsAppNumber(phone) {
  const d = digitsOnly(phone);
  if (!d) return "";
  if (d.length === 10) return "91" + d; // bare 10-digit Indian mobile number
  if (d.length === 11 && d.startsWith("0")) return "91" + d.slice(1);
  return d; // assume it already includes a country code
}
function buildPaymentMessage({
  shopName,
  supplier,
  txn,
  dueAfter
}) {
  const lines = [shopName, "Payment Confirmation", "", `Dear ${supplier.name},`, `A payment of ${fmtMoney(txn.amount)} was made to you on ${dateLabel(txn.date)}.`];
  if (txn.note) lines.push(`Mode / note: ${txn.note}`);
  lines.push(`Challan no: ${txn.id.toUpperCase()}`);
  lines.push(`Balance due after this payment: ${fmtMoney(Math.max(dueAfter, 0))}`);
  lines.push("");
  lines.push("The payment challan (and proof of payment, if attached) is shared separately with this message.");
  lines.push("");
  lines.push("Regards,");
  lines.push(shopName);
  return lines.join("\n");
}

// ---------- challan (receipt) image generator ----------
function generateChallanDataUrl({
  shopName,
  supplier,
  txn,
  dueAfter
}) {
  const canvas = document.createElement("canvas");
  canvas.width = 640;
  canvas.height = 760;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#E2D9C9";
  ctx.lineWidth = 3;
  ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);
  ctx.fillStyle = "#2B2420";
  ctx.font = "bold 26px sans-serif";
  ctx.fillText(shopName, 44, 66);
  ctx.fillStyle = "#83725F";
  ctx.font = "13px sans-serif";
  ctx.fillText("PAYMENT CHALLAN / RECEIPT", 44, 90);
  ctx.strokeStyle = "#E2D9C9";
  ctx.beginPath();
  ctx.moveTo(44, 108);
  ctx.lineTo(596, 108);
  ctx.stroke();
  let y = 150;
  function row(label, value, opts) {
    opts = opts || {};
    ctx.font = "12px sans-serif";
    ctx.fillStyle = "#83725F";
    ctx.fillText(label.toUpperCase(), 44, y);
    ctx.font = (opts.bold ? "bold 19px" : "16px") + " sans-serif";
    ctx.fillStyle = opts.color || "#2B2420";
    ctx.fillText(String(value), 44, y + 24);
    y += 58;
  }
  row("Challan no.", txn.id.toUpperCase());
  row("Date", dateLabel(txn.date));
  row("Paid to", supplier.name);
  if (supplier.contact) row("Supplier contact", supplier.contact);
  row("Amount paid", fmtMoney(txn.amount), {
    bold: true,
    color: "#374F3E"
  });
  if (txn.note) row("Note / mode of payment", txn.note);
  row("Balance due after this payment", fmtMoney(Math.max(dueAfter, 0)), {
    bold: true,
    color: dueAfter > 0 ? "#B3492D" : "#374F3E"
  });
  ctx.strokeStyle = "#E2D9C9";
  ctx.beginPath();
  ctx.moveTo(44, y + 6);
  ctx.lineTo(596, y + 6);
  ctx.stroke();
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#83725F";
  ctx.fillText("This is a system-generated challan for internal record keeping.", 44, canvas.height - 46);
  ctx.fillText(`${shopName} \u00B7 Generated ${dateLabel(todayStr())}`, 44, canvas.height - 26);
  return canvas.toDataURL("image/png");
}

// ---------- CSV export ----------
function escapeCSV(val) {
  const s = String(val === null || val === undefined ? "" : val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadTextFile(filename, content, mime) {
  const blob = new Blob([content], {
    type: mime
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(escapeCSV).join(",")).join("\n");
  downloadTextFile(filename, csv, "text/csv");
}
async function loadKey(userId, key, fallback) {
  try {
    const {
      data,
      error
    } = await supabaseClient.from("app_data").select("value").eq("user_id", userId).eq("key", key).maybeSingle();
    if (error || !data) return fallback;
    return data.value;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(userId, key, value) {
  try {
    await supabaseClient.from("app_data").upsert({
      user_id: userId,
      key,
      value,
      updated_at: new Date().toISOString()
    }, {
      onConflict: "user_id,key"
    });
  } catch (e) {
    console.error("Save failed for", key, e);
