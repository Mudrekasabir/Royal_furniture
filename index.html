<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    --bg:#F6F2EC; --surface:#FFFFFF; --surface-alt:#EFE8DC; --ink:#2B2420; --ink-muted:#83725F;
    --accent:#8B5E34; --accent-dark:#6B4423; --sage:#4C6B58; --sage-dark:#374F3E; --rust:#B3492D; --border:#E2D9C9;
    font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg);
  }
  #root{ min-height:100vh; display:flex; flex-direction:column; max-width:1080px; margin:0 auto; }
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .strong{ font-weight:600; }

  .loading-screen{ display:flex; align-items:center; gap:10px; justify-content:center; height:60vh; color:var(--ink-muted); font-size:14px; }
  .spinner{ width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 28px; width:100%; max-width:360px; text-align:center; }
  .login-emoji{ font-size:32px; margin-bottom:6px; }
  .login-card h1{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px; }
  .login-form{ display:flex; flex-direction:column; gap:12px; margin-top:18px; text-align:left; }
  .btn.full{ width:100%; justify-content:center; }

  .app-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:32px; height:32px; border-radius:8px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .brand h1{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin:0; cursor:pointer; letter-spacing:-0.01em; }
  .brand-input{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; border:none; border-bottom:1px dashed var(--accent); background:transparent; outline:none; color:var(--ink); }
  .header-right{ display:flex; align-items:center; gap:14px; }
  .header-date{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted); }
  .logout-btn{ font-size:12px; color:var(--ink-muted); background:none; border:none; cursor:pointer; text-decoration:underline; }
  .logout-btn:hover{ color:var(--ink); }

  .app-nav{ display:flex; gap:4px; padding:6px; margin:0 20px 8px; background:var(--surface-alt); border-radius:12px; overflow-x:auto; }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px; border:none; background:transparent; border-radius:9px; color:var(--ink-muted); font-size:11px; font-family:'Inter',sans-serif; cursor:pointer; transition:background .15s,color .15s; white-space:nowrap; }
  .nav-btn.active{ background:var(--surface); color:var(--accent-dark); box-shadow:0 1px 2px rgba(43,36,32,0.08); font-weight:600; }
  .nav-btn:hover:not(.active){ color:var(--ink); }
  .nav-emoji{ font-size:16px; }

  .app-main{ flex:1; padding:4px 20px 100px; }
  .view-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .view-head h2{ font-family:'Fraunces',serif; font-size:24px; margin:0; font-weight:600; }
  .view{ animation:fadein .2s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }

  .btn{ display:inline-flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid transparent; cursor:pointer; transition:opacity .15s, background .15s; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-accent:hover:not(:disabled){ background:var(--accent-dark); }
  .btn-ghost{ background:transparent; border-color:var(--border); color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-alt); }

  .icon-btn{ border:none; background:transparent; color:var(--ink-muted); cursor:pointer; padding:6px; border-radius:6px; display:inline-flex; font-size:14px; }
  .icon-btn:hover{ background:var(--surface-alt); color:var(--ink); }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; position:relative; }
  .stat-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .stat-label{ font-size:12px; color:var(--ink-muted); }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .stat-sub{ font-size:11px; color:var(--ink-muted); margin-top:4px; }
  .tone-accent{ color:var(--accent-dark); }
  .tone-sage{ color:var(--sage-dark); }
  .tone-rust{ color:var(--rust); }
  .tone-ink{ color:var(--ink); }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .two-col{ grid-template-columns:1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h3{ font-family:'Fraunces',serif; font-size:15px; margin:0 0 10px; font-weight:600; }
  .muted-note{ font-size:13px; color:var(--ink-muted); }

  .list{ list-style:none; margin:0; padding:0; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--border); }
  .list-row:last-child{ border-bottom:none; }
  .row-title{ font-size:13px; font-weight:600; }
  .row-sub{ font-size:11px; color:var(--ink-muted); margin-top:2px; }
  .row-amount{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; }

  .tag{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap; }
  .tag-rust{ background:#F5E3DC; color:var(--rust); }
  .tag-sage{ background:#E2E9E4; color:var(--sage-dark); }

  .empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:48px 20px; color:var(--ink-muted); border:1px dashed var(--border); border-radius:14px; background:var(--surface); }
  .empty-state h3{ font-family:'Fraunces',serif; color:var(--ink); font-size:17px; margin:4px 0 0; }
  .empty-state p{ font-size:13px; max-width:320px; margin:0 0 6px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; flex:1; min-width:180px; color:var(--ink-muted); }

  .stock-name{ font-weight:600; font-size:14px; }
  .stock-cat{ font-size:11px; color:var(--ink-muted); margin-top:1px; }
  .stock-actions{ display:flex; gap:2px; }
  .stock-details{ display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--ink-muted); margin:8px 0; }
  .stock-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }

  .supplier-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }

  .field{ display:flex; flex-direction:column; gap:5px; }

  .input{ border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13px; font-family:'Inter',sans-serif; color:var(--ink); outline:none; width:100%; }

  .total-preview{ margin-top:12px; font-size:13px; padding:10px 12px; background:var(--surface-alt); border-radius:8px; }
  .form-error{ margin-top:4px; font-size:12px; color:var(--rust); background:#F5E3DC; padding:8px 10px; border-radius:8px; }

  .bar-chart{ display:flex; align-items:flex-end; gap:16px; height:220px; padding:10px 4px 0; overflow-x:auto; }
  .bar-group{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:44px; height:100%; justify-content:flex-end; }
  .bars{ display:flex; align-items:flex-end; gap:4px; height:180px; }
  .bar{ width:14px; border-radius:3px 3px 0 0; min-height:2px; }
  .bar-accent{ background:var(--accent); }
  .bar-sage{ background:var(--sage); }
  .bar-label{ font-size:10px; color:var(--ink-muted); white-space:nowrap; }
  .bar-legend{ display:flex; gap:16px; font-size:11px; color:var(--ink-muted); margin-top:8px; align-items:center; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .dot-accent{ background:var(--accent); }
  .dot-sage{ background:var(--sage); }
</style>
